<!-- ATLAS (City Intel): right-rail ranking panel. docs/cockpit/DESIGN.md §2.
     Nested inside context.html's #right-context-rail, before #global-context-panel,
     so it shares the rail's flex layout and collapse/measure CSS. -->
<div
  id="city-intel-panel"
  class="panel-collapsible collapsed"
  data-panel-id="city-intel-panel"
  hidden
>
  <div class="panel-glow"></div>
  <div class="city-intel-panel-inner" data-rail-scroller>
    <div class="panel-header">
      <span class="panel-title">ATLAS</span>
      <span id="ci-voice-chip" class="ci-voice-chip" hidden>VIA VOICE</span>
      <span class="panel-divider"></span>
      <button
        id="city-intel-exit"
        class="panel-layer-toggle"
        type="button"
        aria-label="Exit ATLAS mode"
        hidden
      >
        EXIT
      </button>
      <button
        class="panel-collapse-btn"
        data-collapse-target="city-intel-panel"
        type="button"
        title="Expand panel"
      >
        ▶
      </button>
    </div>
    <div class="cyber-panel-body" data-rail-scroller>
      <div
        id="ci-status"
        class="ci-visually-hidden"
        role="status"
        aria-live="polite"
      ></div>

      <div
        id="ci-mode-seg"
        class="pp-mode-seg"
        role="radiogroup"
        aria-label="Panel view"
      >
        <button
          class="pp-mode-btn active"
          id="ci-mode-rank"
          type="button"
          data-mode="rank"
          role="radio"
          aria-checked="true"
        >
          RANK
        </button>
        <button
          class="pp-mode-btn"
          id="ci-mode-plan"
          type="button"
          data-mode="plan"
          role="radio"
          aria-checked="false"
        >
          PLAN
        </button>
      </div>

      <p class="ci-note">
        Indicative, built from public statistics; mostly country-level; not
        relocation advice.
        <a id="ci-methodology-link" target="_blank" rel="noopener"
          >How scores work</a
        >
      </p>

      <!-- T12b planner polish: at 1440x900 the legend/weights/refine trio left
           only ~100px for the scorecard itself. Collapsed into one summary row
           while a scorecard is open (JS toggles display via [data-ci-view]);
           EDIT expands them back in place, DONE re-collapses. Session-only,
           not persisted. Ranking view is unaffected. -->
      <div
        id="ci-scorecard-controls-summary"
        class="ci-controls-summary ci-rank-only"
      >
        <span id="ci-controls-summary-text"></span>
        <button
          type="button"
          id="ci-controls-expand-btn"
          class="ci-link-btn"
        >
          EDIT
        </button>
      </div>

      <section
        class="ci-legend ci-rank-only"
        aria-label="Score colour scale, 0 to 100; hollow grey ring means insufficient data"
      >
        <span class="ci-section-label">SCORE</span>
        <div class="ci-legend-ramp">
          <span
            class="ci-legend-bin"
            style="background: var(--ci-score-0)"
          ></span>
          <span
            class="ci-legend-bin"
            style="background: var(--ci-score-1)"
          ></span>
          <span
            class="ci-legend-bin"
            style="background: var(--ci-score-2)"
          ></span>
          <span
            class="ci-legend-bin"
            style="background: var(--ci-score-3)"
          ></span>
          <span
            class="ci-legend-bin"
            style="background: var(--ci-score-4)"
          ></span>
        </div>
        <div class="ci-legend-ticks">
          <span>0</span><span>20</span><span>40</span><span>60</span
          ><span>80</span><span>100</span>
        </div>
        <div class="ci-legend-neutral">
          <span class="ci-legend-ring"></span>
          <span>no data</span>
        </div>
      </section>

      <section class="ci-weights ci-rank-only" aria-label="Score weights">
        <span class="ci-section-label">WEIGHTS</span>
        <div
          id="ci-preset-seg"
          class="pp-mode-seg"
          role="radiogroup"
          aria-label="Weighting preset"
        >
          <button
            class="pp-mode-btn active"
            id="ci-preset-balanced"
            type="button"
            data-preset="BALANCED"
            role="radio"
            aria-checked="true"
          >
            BALANCED
          </button>
          <button
            class="pp-mode-btn"
            id="ci-preset-budget"
            type="button"
            data-preset="BUDGET"
            role="radio"
            aria-checked="false"
          >
            BUDGET
          </button>
          <button
            class="pp-mode-btn"
            id="ci-preset-safety"
            type="button"
            data-preset="SAFETY"
            role="radio"
            aria-checked="false"
          >
            SAFETY
          </button>
          <button
            class="pp-mode-btn"
            id="ci-preset-custom"
            type="button"
            data-preset="CUSTOM"
            role="radio"
            aria-checked="false"
          >
            CUSTOM
          </button>
        </div>
        <div class="ci-slider-row">
          <label for="ci-weight-qol">Quality of life</label>
          <input
            id="ci-weight-qol"
            class="gev-quantitative-slider"
            type="range"
            min="0"
            max="10"
            step="1"
            value="5"
          />
          <output
            id="ci-weight-qol-value"
            class="gev-slider-value"
            for="ci-weight-qol"
            >5</output
          >
        </div>
        <div class="ci-slider-row">
          <label for="ci-weight-cost">Cost</label>
          <input
            id="ci-weight-cost"
            class="gev-quantitative-slider"
            type="range"
            min="0"
            max="10"
            step="1"
            value="5"
          />
          <output
            id="ci-weight-cost-value"
            class="gev-slider-value"
            for="ci-weight-cost"
            >5</output
          >
        </div>
        <div class="ci-slider-row">
          <label for="ci-weight-safety">Safety</label>
          <input
            id="ci-weight-safety"
            class="gev-quantitative-slider"
            type="range"
            min="0"
            max="10"
            step="1"
            value="5"
          />
          <output
            id="ci-weight-safety-value"
            class="gev-slider-value"
            for="ci-weight-safety"
            >5</output
          >
        </div>
        <div class="ci-slider-row">
          <label for="ci-weight-travel">Travel ease</label>
          <input
            id="ci-weight-travel"
            class="gev-quantitative-slider"
            type="range"
            min="0"
            max="10"
            step="1"
            value="5"
          />
          <output
            id="ci-weight-travel-value"
            class="gev-slider-value"
            for="ci-weight-travel"
            >5</output
          >
        </div>
      </section>

      <!-- Layout compaction (T6b planner decision, overrides DESIGN §2 order:
           HOME PASSPORT + FILTERS collapse into one disclosure so the ranking
           rows are visible above the fold at 1440x900; see the T6b report. -->
      <details id="ci-refine" class="ci-refine ci-rank-only">
        <summary>
          PASSPORT &amp; FILTERS
          <span id="ci-refine-active" class="ci-refine-active">none</span>
        </summary>

        <section class="ci-passport" aria-label="Home passport">
          <span class="ci-section-label">HOME PASSPORT</span>
          <select id="ci-passport" class="pp-select" aria-label="Home passport">
            <option value="">Not set</option>
          </select>
          <p id="ci-passport-helper" class="ci-helper">
            Visa access counts toward Travel ease once set.
          </p>
        </section>

        <section class="ci-filters" aria-label="Filters">
          <span class="ci-section-label">FILTERS</span>
          <label class="ci-filter-row" for="ci-filter-region">
            <span>Region</span>
            <select id="ci-filter-region" class="pp-select" aria-label="Region">
              <option value="">All regions</option>
              <option value="Africa">Africa</option>
              <option value="Asia">Asia</option>
              <option value="Europe">Europe</option>
              <option value="North America">North America</option>
              <option value="Oceania">Oceania</option>
              <option value="South America">South America</option>
            </select>
          </label>
          <label class="ci-filter-row" for="ci-filter-min-pop">
            <span>Min. population</span>
            <select
              id="ci-filter-min-pop"
              class="pp-select"
              aria-label="Minimum population"
            >
              <option value="0">Any</option>
              <option value="250000">250k</option>
              <option value="500000">500k</option>
              <option value="1000000">1M</option>
              <option value="5000000">5M</option>
            </select>
          </label>
          <label class="ci-checkbox-row" for="ci-filter-hide-advisory">
            <input id="ci-filter-hide-advisory" type="checkbox" />
            <span>Hide Level 3–4 advisories</span>
          </label>
          <p id="ci-filter-hide-advisory-helper" class="ci-helper" hidden>
            advisories offline
          </p>
          <label class="ci-checkbox-row" for="ci-filter-include-ineligible">
            <input id="ci-filter-include-ineligible" type="checkbox" />
            <span>Show cities with insufficient data</span>
          </label>
        </section>
      </details>

      <section
        id="ci-ranking-view"
        class="ci-ranking ci-rank-only"
        aria-label="Ranking"
      >
        <div class="ci-ranking-header">
          <span id="ci-ranking-count">RANKING · 0 cities</span>
          <div
            id="ci-view-seg"
            class="pp-mode-seg"
            role="radiogroup"
            aria-label="Ranking view"
          >
            <button
              class="pp-mode-btn active"
              id="ci-view-grouped"
              type="button"
              data-view="grouped"
              role="radio"
              aria-checked="true"
            >
              BY COUNTRY
            </button>
            <button
              class="pp-mode-btn"
              id="ci-view-flat"
              type="button"
              data-view="flat"
              role="radio"
              aria-checked="false"
            >
              ALL
            </button>
          </div>
        </div>
        <div
          id="ci-list"
          class="ci-list"
          role="list"
          aria-label="Ranked cities"
        ></div>
        <button
          id="ci-show-more"
          class="scene-btn ci-show-more"
          type="button"
          hidden
        >
          SHOW 100 MORE
        </button>
        <div class="ci-pins" aria-label="Pinned cities">
          <div id="ci-pins-tray" class="ci-pins-tray"></div>
          <button id="ci-compare-btn" class="scene-btn" type="button" disabled>
            COMPARE (0)
          </button>
        </div>
      </section>

      <!-- The scorecard replaces this ranking view in place. -->
      <section id="ci-scorecard-view" class="ci-rank-only" hidden></section>

      <!-- DESIGN §11.1/§5: the PLAN view (planView.js) mounts here. -->
      <div id="ci-plan-view" class="ci-plan" hidden></div>
    </div>
  </div>
</div>
